name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JavaScript / TypeScript ─────────────────────────────────────────────────
  js-quality:
    name: JS/TS Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  # ── Python ─────────────────────────────────────────────────────────────────
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibepulse
          POSTGRES_PASSWORD: vibepulse_dev
          POSTGRES_DB: vibepulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibepulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vibepulse:vibepulse_dev@localhost:5432/vibepulse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Format check (ruff)
        run: uv run ruff format --check app/

      - name: Run tests
        run: uv run pytest --tb=short

  # ── Docker build check ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [js-quality, python-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/api.Dockerfile
          push: false
          tags: vibepulse/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
