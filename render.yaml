# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint Specification – VibePulse
# Official Documentation: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

version: "1"

services:
  # ── Backend API Service (FastAPI + SQLAlchemy) ─────────────────────────────
  - type: web
    name: vibepulse-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5184"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["https://vibepulse-dashboard.onrender.com","http://localhost:5183","http://localhost:3000"]'
      - key: RENDER_KEEP_ALIVE
        value: "false"
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: "12"

  # ── Frontend Dashboard (React + Vite Single-Page Application) ──────────────
  - type: web
    name: vibepulse-dashboard
    runtime: static
    buildCommand: (corepack enable 2>/dev/null || npm install -g pnpm@9.15.4) && pnpm install && (pnpm --filter @vibepulse/dashboard build || pnpm --filter ./apps/dashboard build)
    staticPublishPath: ./apps/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        value: https://vibepulse-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
