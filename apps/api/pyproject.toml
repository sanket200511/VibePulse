[project]
name = "vibepulse-api"
version = "0.1.0"
description = "VibePulse API – Developer Observability Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.1",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "ruff>=0.9.1",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "ANN", # flake8-annotations
  "S",   # bandit (security)
  "RUF", # ruff-specific
]
ignore = [
  "ANN101", # missing type annotation for self
  "ANN102", # missing type annotation for cls
  "S101",   # use of assert (fine in tests)
  "B008",   # FastAPI's Depends() in defaults is the idiomatic DI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
